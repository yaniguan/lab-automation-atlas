name: links

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  lean-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Initialize ephemeral zero-dependency Lake manifest
        run: |
          printf '%s\n' '{"version": "1.3.0", "packagesDir": ".lake/packages", "packages": [], "name": "\u00ablab-atlas-lean\u00bb", "lakeDir": ".lake", "fixedToolchain": false}' > lean/lake-manifest.json
      - name: Verify LabAtlasLean formal proofs (0 sorry, 0 warnings)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: "lean"
          use-mathlib-cache: false
      - name: Verify Lean 4.36.0 #print axioms (no custom axioms) and >=100-case #eval Python parity
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          python scripts/verify_lean_parity.py --min-cases 100

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Verify catalog schema and README table sync
        run: |
          python scripts/sync_catalog.py --check
          python scripts/gen_lean_parity.py --check
      - name: Run offline unit tests and offline link audit
        run: |
          pytest -q
          python scripts/check_links.py --offline
          lab-atlas list --category software --commercial-ok --json > /dev/null

  check:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check external and local links
        run: python scripts/check_links.py --json-out reports/link_status.json
      - name: Upload link status JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-status-report
          path: reports/link_status.json

  license-audit:
    if: github.event_name == 'schedule'
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify upstream Hugging Face, GitHub, and Zenodo licenses
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_licenses.py --json-out reports/license_status.json
      - name: Upload license status JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-status-report
          path: reports/license_status.json
